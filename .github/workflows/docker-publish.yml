name: Docker Build and Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE: ghcr.io/mx10-ac2n/simplex-bridge

jobs:
  tests:
    name: Tests and validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install pyyaml
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate shell syntax
        run: |
          bash -n entrypoint.sh
          bash -n install-websockets.sh
          bash -n tests/*.sh

      - name: Run ShellCheck
        run: |
          shellcheck entrypoint.sh install-websockets.sh tests/*.sh

      - name: Run regression suite
        run: |
          bash tests/run-all.sh

  smoke:
    # F-04: the fork had no job that actually RUNS the built image. A broken
    # cap_drop/no-new-privileges combination (the entrypoint needs
    # CHOWN+SETUID+SETGID to chown /data and drop to the unprivileged user)
    # used to pass lint and the metadata-only build step undetected, and
    # ship green. This job builds the image and runs it with exactly the
    # capability set docker-compose.yml uses, then waits for a `healthy`
    # Docker healthcheck status.
    #
    # Runs on BOTH published architectures. arm64 executes under QEMU
    # emulation, which is slow — hence the longer startup window below.
    # Emulation does not replace real-hardware testing, but it does prove
    # the arm64 asset, its SHA256 pin, and the entrypoint all work end to
    # end — exactly what a single-arch build could never catch, and exactly
    # what let an arm64-only regression (e.g. a wrong pinned checksum) ship
    # silently before.
    name: smoke (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (load into local docker)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: simplex-bridge:smoke
          cache-from: type=gha

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Run container with compose security options
        run: |
          docker volume create simplex-smoke-data
          # Mirror docker-compose.yml exactly: cap_drop ALL + the three caps
          # the entrypoint legitimately needs, plus no-new-privileges. Bridge
          # networking keeps the daemon's 127.0.0.1:5225 bind inside the
          # container's own netns (the in-container healthcheck still probes
          # it over loopback) and avoids binding a port on the shared runner
          # host.
          docker run -d --name simplex-smoke \
            --platform ${{ matrix.platform }} \
            --network bridge \
            -v simplex-smoke-data:/data \
            --cap-drop ALL \
            --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges:true \
            -e SIMPLEX_STARTUP_TIMEOUT=180 \
            simplex-bridge:smoke

      - name: Wait for healthy status
        run: |
          # Emulated arm64 starts the Haskell daemon far slower than native
          # amd64, so the poll budget scales with the platform.
          if [ "${{ matrix.platform }}" = "linux/arm64" ]; then
            ATTEMPTS=120
          else
            ATTEMPTS=40
          fi
          for i in $(seq 1 "$ATTEMPTS"); do
            STATE=$(docker inspect --format '{{.State.Health.Status}}' simplex-smoke 2>/dev/null || echo none)
            RUNNING=$(docker inspect --format '{{.State.Running}}' simplex-smoke 2>/dev/null || echo false)
            echo "attempt $i: running=$RUNNING health=$STATE"
            if [ "$STATE" = "healthy" ]; then
              echo "container became healthy"
              docker logs simplex-smoke 2>&1 | tail -20
              exit 0
            fi
            if [ "$RUNNING" != "true" ]; then
              echo "::error::container exited during startup"
              docker logs simplex-smoke 2>&1 | tail -40
              exit 1
            fi
            sleep 3
          done
          echo "::error::container never became healthy"
          docker logs simplex-smoke 2>&1 | tail -40
          exit 1

      - name: Bot address was created
        # Non-fatal by design: the bot address is produced by the first-run
        # setup, which contacts the SimpleX SMP servers. Outbound filtering
        # or a slow/unavailable server in the runner makes this fail even
        # when the image is perfectly healthy, and the entrypoint already
        # treats setup failure as retryable on next start (see F-01).
        # Healthy status is the real gate.
        continue-on-error: true
        run: |
          ADDR=$(docker exec simplex-smoke cat /data/bot_address.txt 2>/dev/null || echo "")
          if [ -z "$ADDR" ]; then
            echo "::warning::no bot address yet (first-run setup needs outbound access to SimpleX servers)"
            exit 0
          fi
          echo "bot address: ${ADDR:0:60}..."
          case "$ADDR" in
            simplex:/*) echo "bot address looks valid" ;;
            *) echo "::warning::unexpected bot address format: $ADDR" ;;
          esac

      - name: Container logs
        if: always()
        run: docker logs simplex-smoke 2>&1 | tail -40

      - name: Cleanup
        if: always()
        run: |
          docker rm -f simplex-smoke 2>/dev/null || true
          docker volume rm simplex-smoke-data 2>/dev/null || true

  build:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: smoke

    # F-04: this job used to be skipped entirely on pull_request
    # (if: github.event_name == 'push'), so a broken Dockerfile could merge
    # straight to main — CI only discovered it after the merge, at publish
    # time. Now the job always runs (it needs `smoke`, which already built
    # and ran the image); only the actual registry push is gated below.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report build scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::notice title=PR build is publish-free::This run builds only; nothing is pushed to GHCR."
          else
            echo "Push detected — this run builds and publishes to GHCR."
          fi

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # F-02: metadata-action infers org.opencontainers.image.licenses
          # from the GitHub repo's license and OVERRIDES the Dockerfile
          # LABEL via this `labels:` block. This repo's LICENSE file is
          # GPL-3.0, but the shipped image redistributes AGPL-3.0 binaries
          # (simplex-chat, simplexmq) — without this override, the published
          # manifest advertised GPL-3.0 while the image actually carried
          # AGPL-3.0 obligations (verified on the live GHCR manifest before
          # this fix: org.opencontainers.image.licenses = GPL-3.0, wrong).
          # Pin it explicitly so published metadata matches what's shipped.
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
