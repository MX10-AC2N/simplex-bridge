
services:
  simplex-bridge:
    # Pinned by digest to the v1.5.1 release (the multi-arch image index),
    # not :latest (moves with main) nor a bare tag (a tag can be re-pushed).
    # No `build:` here on purpose: compose names a locally built image after
    # `image:`, and a @sha256: reference is not a valid build name. For a
    # local build use the override:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    # To upgrade: docker buildx imagetools inspect ghcr.io/mx10-ac2n/simplex-bridge:<tag>
    # and copy the top-level "Digest:" line here.
    image: ghcr.io/mx10-ac2n/simplex-bridge@sha256:4999546c7298fa4fd71d7d96dacac4585fac0b0cf90a1e7fd8a8dfe53c0407f1
    container_name: simplex-bridge
    # Home Assistant must also use network_mode: host on this same Linux host.
    # Both containers then reach the CLI via ws://127.0.0.1:5225.
    # Do not publish 5225 and do not enable SIMPLEX_SOCAT_PORT for this setup.
    network_mode: host

    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

    security_opt:
      - no-new-privileges:true

    tmpfs:
      - /tmp

    volumes:
      - simplex-data:/data
      - simplex-inbox:/data/received_files
      - simplex-outbox:/config/simplex_outbox

    environment:
      SIMPLEX_DISPLAY_NAME: "SimpleX Bridge"
      SIMPLEX_AUTO_ACCEPT: "true"
      SIMPLEX_FILES_ENABLED: "true"
      SIMPLEX_FILES_DIR: "/data/received_files"
      SIMPLEX_MARK_READ: "true"
      SIMPLEX_TOR: "false"
      SIMPLEX_STARTUP_TIMEOUT: "30"
      SIMPLEX_DNS_CHECK_HOST: "smp5.simplex.im"
      # Exemple de commandes (optionnel)
      # SIMPLEX_BOT_COMMANDS: "'Help':/help,'Status':/status,'Info':/info"
      PUID: "99"
      PGID: "100"
      TZ: "UTC"

    restart: unless-stopped

volumes:
  simplex-data:
  simplex-inbox:
    name: simplex-inbox
  simplex-outbox:
    name: simplex-outbox
