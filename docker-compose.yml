
services:
  simplex-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/mx10-ac2n/simplex-bridge:latest
    container_name: simplex-bridge
    network_mode: host

    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

    security_opt:
      - no-new-privileges:true

    tmpfs:
      - /tmp

    volumes:
      - simplex-data:/data

    environment:
      SIMPLEX_DISPLAY_NAME: "SimpleX Bridge"
      SIMPLEX_AUTO_ACCEPT: "true"
      SIMPLEX_FILES_ENABLED: "true"
      SIMPLEX_MARK_READ: "true"
      SIMPLEX_TOR: "false"
      SIMPLEX_STARTUP_TIMEOUT: "30"
      SIMPLEX_DNS_CHECK_HOST: "smp5.simplex.im"

      PUID: "99"
      PGID: "100"
      TZ: "UTC"

    restart: unless-stopped

volumes:
  simplex-data:
